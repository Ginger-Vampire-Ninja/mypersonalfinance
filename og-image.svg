<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Purple accent glow top-right -->
  <ellipse cx="1050" cy="120" rx="280" ry="200" fill="rgba(108,99,255,0.12)"/>

  <!-- Logo -->
  <text x="96" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="white">Fin<tspan fill="#6c63ff">aura</tspan></text>

  <!-- Main headline -->
  <text x="96" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="white" letter-spacing="-2">Take control of</text>
  <text x="96" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-2">
    <tspan fill="white">your </tspan><tspan fill="url(#accent)">finances</tspan>
  </text>

  <!-- Subheadline -->
  <text x="96" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#9ca3af">Track income, expenses, credit cards and loans.</text>
  <text x="96" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#9ca3af">Cashflow forecasting built in. Free &amp; private.</text>

  <!-- Feature pills -->
  <rect x="96" y="444" width="158" height="42" rx="21" fill="rgba(108,99,255,0.2)" stroke="rgba(108,99,255,0.4)" stroke-width="1"/>
  <text x="175" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#a5a0ff" text-anchor="middle" font-weight="600">📈 Cashflow</text>

  <rect x="268" y="444" width="168" height="42" rx="21" fill="rgba(108,99,255,0.2)" stroke="rgba(108,99,255,0.4)" stroke-width="1"/>
  <text x="352" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#a5a0ff" text-anchor="middle" font-weight="600">💳 Credit Cards</text>

  <rect x="450" y="444" width="128" height="42" rx="21" fill="rgba(108,99,255,0.2)" stroke="rgba(108,99,255,0.4)" stroke-width="1"/>
  <text x="514" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#a5a0ff" text-anchor="middle" font-weight="600">🏦 Loans</text>

  <rect x="592" y="444" width="168" height="42" rx="21" fill="rgba(108,99,255,0.2)" stroke="rgba(108,99,255,0.4)" stroke-width="1"/>
  <text x="676" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#a5a0ff" text-anchor="middle" font-weight="600">🔒 100% Private</text>

  <!-- CTA box -->
  <rect x="96" y="520" width="280" height="58" rx="12" fill="url(#accent)"/>
  <text x="236" y="556" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">Launch Free →</text>

  <!-- URL -->
  <text x="1104" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#4b5563" text-anchor="end">ginger-vampire-ninja.github.io/mypersonalfinance</text>
</svg>
